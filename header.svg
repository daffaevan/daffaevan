<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .glow-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 36px;
      font-weight: 800;
      fill: #2dd4bf;
      filter: drop-shadow(0px 0px 12px rgba(45, 212, 191, 0.6));
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 600;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 500;
      fill: #38bdf8;
    }
    .location-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 500;
      fill: #f43f5e;
    }
  </style>

  <rect width="800" height="200" rx="12" fill="#0b1d16" fill-opacity="0.5"/>
  <rect x="1" y="1" width="798" height="198" rx="11" stroke="#1f4e38" stroke-opacity="0.6" stroke-width="2"/>

  <!-- Nama Daffa dengan Efek Glow -->
  <text x="400" y="65" text-anchor="middle" class="glow-text">Daffa Evan Fadila</text>

  <!-- Subtitle -->
  <text x="400" y="105" text-anchor="middle" class="subtitle">
    🚀 IoT &amp; Network Engineer | Connecting Hardware &amp; Systems
  </text>

  <!-- Badge IoT -->
  <g transform="translate(230, 135)">
    <rect width="165" height="30" rx="15" fill="#0284c7" fill-opacity="0.15" stroke="#0ea5e9" stroke-width="1"/>
    <text x="82.5" y="20" text-anchor="middle" class="badge-text">⚡ IoT &amp; Network</text>
  </g>

  <!-- Badge Lokasi -->
  <g transform="translate(410, 135)">
    <rect width="160" height="30" rx="15" fill="#f43f5e" fill-opacity="0.15" stroke="#fb7185" stroke-width="1"/>
    <text x="80" y="20" text-anchor="middle" class="location-text">📍 Indonesia</text>
  </g>
</svg>

<svg width="800" height="340" viewBox="0 0 800 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Jendela Terminal -->
  <rect x="10" y="10" width="780" height="320" rx="8" fill="#091a13" stroke="#1b4d38" stroke-width="2"/>
  <path d="M 10 18 C 10 13 13 10 18 10 L 782 10 C 787 10 790 13 790 18 L 790 40 L 10 40 Z" fill="#0f2b20"/>
  <line x1="10" y1="40" x2="790" y2="40" stroke="#1b4d38" stroke-width="1"/>

  <!-- Tombol Mac Style -->
  <circle cx="28" cy="25" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="25" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="25" r="6" fill="#27c93f"/>

  <!-- Judul File -->
  <text x="400" y="29" text-anchor="middle" font-family="monospace" font-size="13px" fill="#4ee1a0">developer.js</text>
  <circle cx="735" cy="25" r="4" fill="#3fb950"/>
  <text x="750" y="29" font-family="monospace" font-size="13px" fill="#4ee1a0">status</text>

  <!-- Baris Nomor -->
  <text x="30" y="75" font-family="monospace" font-size="14px" fill="#2c6b50">1</text>
  <text x="30" y="100" font-family="monospace" font-size="14px" fill="#2c6b50">2</text>
  <text x="30" y="125" font-family="monospace" font-size="14px" fill="#2c6b50">3</text>
  <text x="30" y="150" font-family="monospace" font-size="14px" fill="#2c6b50">4</text>
  <text x="30" y="175" font-family="monospace" font-size="14px" fill="#2c6b50">5</text>
  <text x="30" y="200" font-family="monospace" font-size="14px" fill="#2c6b50">6</text>
  <text x="30" y="225" font-family="monospace" font-size="14px" fill="#2c6b50">7</text>
  <text x="30" y="250" font-family="monospace" font-size="14px" fill="#2c6b50">8</text>
  <text x="30" y="275" font-family="monospace" font-size="14px" fill="#2c6b50">9</text>

  <!-- Isi Kode dengan Animasi SVG Asli (Aman dari Blokir GitHub) -->
  <g font-family="monospace" font-size="14px">
    
    <!-- Baris 1 -->
    <text x="70" y="75" fill="#ff7b72">const <tspan fill="#7ee787">engineer</tspan> <tspan fill="#ff7b72">=</tspan> <tspan fill="#ff7b72">{</tspan>
      <animateTransform attributeName="transform" type="translate" from="-40 0" to="0 0" dur="0.4s" begin="0s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0s" fill="freeze"/>
    </text>

    <!-- Baris 2 -->
    <text x="90" y="100" fill="#79c0ff">name: <tspan fill="#a5d6ff">"Daffa Evan Fadila"</tspan>,
      <animateTransform attributeName="transform" type="translate" from="-40 0" to="0 0" dur="0.4s" begin="0.15s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.15s" fill="freeze"/>
    </text>

    <!-- Baris 3 -->
    <text x="90" y="125" fill="#79c0ff">role: <tspan fill="#a5d6ff">"IoT &amp; Network Engineer"</tspan>,
      <animateTransform attributeName="transform" type="translate" from="-40 0" to="0 0" dur="0.4s" begin="0.3s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.3s" fill="freeze"/>
    </text>

    <!-- Baris 4 -->
    <text x="90" y="150" fill="#79c0ff">stack: <tspan fill="#ff7b72">[</tspan><tspan fill="#a5d6ff">"ESP32"</tspan>, <tspan fill="#a5d6ff">"Cisco"</tspan>, <tspan fill="#a5d6ff">"MQTT"</tspan>, <tspan fill="#a5d6ff">"Python"</tspan><tspan fill="#ff7b72">]</tspan>,
      <animateTransform attributeName="transform" type="translate" from="-40 0" to="0 0" dur="0.4s" begin="0.45s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.45s" fill="freeze"/>
    </text>

    <!-- Baris 5 -->
    <text x="90" y="175" fill="#79c0ff">focus: <tspan fill="#a5d6ff">"connecting hardware &amp; networks"</tspan>,
      <animateTransform attributeName="transform" type="translate" from="-40 0" to="0 0" dur="0.4s" begin="0.6s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.6s" fill="freeze"/>
    </text>

    <!-- Baris 6 -->
    <text x="90" y="200" fill="#79c0ff">build: <tspan fill="#7ee787">()</tspan> <tspan fill="#ff7b72">=&gt;</tspan> <tspan fill="#ff7b72">{</tspan>
      <animateTransform attributeName="transform" type="translate" from="-40 0" to="0 0" dur="0.4s" begin="0.75s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.75s" fill="freeze"/>
    </text>

    <!-- Baris 7 -->
    <text x="110" y="225" fill="#ff7b72">return <tspan fill="#a5d6ff">"smart system solutions"</tspan>;
      <animateTransform attributeName="transform" type="translate" from="-40 0" to="0 0" dur="0.4s" begin="0.9s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.9s" fill="freeze"/>
    </text>

    <!-- Baris 8 -->
    <text x="90" y="250" fill="#ff7b72">}
      <animateTransform attributeName="transform" type="translate" from="-40 0" to="0 0" dur="0.4s" begin="1.05s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.05s" fill="freeze"/>
    </text>

    <!-- Baris 9 -->
    <text x="70" y="275" fill="#ff7b72">};
      <animateTransform attributeName="transform" type="translate" from="-40 0" to="0 0" dur="0.4s" begin="1.2s" fill="freeze"/>
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.2s" fill="freeze"/>
    </text>
  </g>

  <!-- Status Bar Bawah -->
  <line x1="10" y1="300" x2="790" y2="300" stroke="#1b4d38" stroke-width="1"/>
  <text x="25" y="318" font-family="monospace" font-size="12px" fill="#4ee1a0">🌿 main</text>
  <text x="100" y="318" font-family="monospace" font-size="12px" fill="#4ee1a0">Ln 10, Col 2</text>
  <text x="700" y="318" font-family="monospace" font-size="12px" fill="#4ee1a0">⚡ Live</text>
  <text x="745" y="318" font-family="monospace" font-size="12px" fill="#4ee1a0">JS</text>
</svg>

<svg width="800" height="340" viewBox="0 0 800 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .window {
      fill: #091a13;
      stroke: #1b4d38;
      stroke-width: 2;
    }
    .titlebar {
      fill: #0f2b20;
    }
    .text-title {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
      font-size: 13px;
      fill: #4ee1a0;
    }
    .line-num {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
      font-size: 14px;
      fill: #2c6b50;
    }
    .code-keyword {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
      font-size: 14px;
      font-weight: 600;
      fill: #ff7b72;
    }
    .code-variable {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
      font-size: 14px;
      fill: #7ee787;
    }
    .code-key {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
      font-size: 14px;
      fill: #79c0ff;
    }
    .code-string {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
      font-size: 14px;
      fill: #a5d6ff;
    }
    .status-bar {
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
      font-size: 12px;
      fill: #4ee1a0;
    }
    .shining-overlay {
      fill: url(#shine-gradient);
      mix-blend-mode: overlay;
      animation: shineMove 4s infinite linear;
    }
    @keyframes shineMove {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>

  <defs>
    <linearGradient id="shine-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="780" height="320" rx="8" class="window"/>
  <path d="M 10 18 C 10 13 13 10 18 10 L 782 10 C 787 10 790 13 790 18 L 790 40 L 10 40 Z" class="titlebar"/>
  <line x1="10" y1="40" x2="790" y2="40" stroke="#1b4d38" stroke-width="1"/>

  <circle cx="28" cy="25" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="25" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="25" r="6" fill="#27c93f"/>

  <text x="400" y="29" text-anchor="middle" class="text-title">developer.js</text>
  <circle cx="735" cy="25" r="4" fill="#3fb950"/>
  <text x="750" y="29" class="text-title">status</text>

  <text x="30" y="75" class="line-num">1</text>
  <text x="30" y="100" class="line-num">2</text>
  <text x="30" y="125" class="line-num">3</text>
  <text x="30" y="150" class="line-num">4</text>
  <text x="30" y="175" class="line-num">5</text>
  <text x="30" y="200" class="line-num">6</text>
  <text x="30" y="225" class="line-num">7</text>
  <text x="30" y="250" class="line-num">8</text>
  <text x="30" y="275" class="line-num">9</text>

  <text x="70" y="75">
    <tspan class="code-keyword">const</tspan> <tspan class="code-variable">engineer</tspan> <tspan class="code-key">=</tspan> <tspan class="code-keyword">{</tspan>
  </text>
  <text x="70" y="100">
    <tspan dx="20" class="code-key">name:</tspan> <tspan class="code-string">"Daffa Evan Fadila"</tspan>,
  </text>
  <text x="70" y="125">
    <tspan dx="20" class="code-key">role:</tspan> <tspan class="code-string">"IoT &amp; Network Engineer"</tspan>,
  </text>
  <text x="70" y="150">
    <tspan dx="20" class="code-key">stack:</tspan> <tspan class="code-keyword">[</tspan><tspan class="code-string">"ESP32"</tspan>, <tspan class="code-string">"Cisco"</tspan>, <tspan class="code-string">"MQTT"</tspan>, <tspan class="code-string">"Python"</tspan><tspan class="code-keyword">]</tspan>,
  </text>
  <text x="70" y="175">
    <tspan dx="20" class="code-key">focus:</tspan> <tspan class="code-string">"connecting hardware &amp; networks"</tspan>,
  </text>
  <text x="70" y="200">
    <tspan dx="20" class="code-key">build:</tspan> <tspan class="code-variable">()</tspan> <tspan class="code-keyword">=&gt;</tspan> <tspan class="code-keyword">{</tspan>
  </text>
  <text x="70" y="225">
    <tspan dx="40" class="code-keyword">return</tspan> <tspan class="code-string">"smart system solutions"</tspan>;
  </text>
  <text x="70" y="250">
    <tspan dx="20" class="code-keyword">}</tspan>
  </text>
  <text x="70" y="275">
    <tspan class="code-keyword">}</tspan>;
  </text>

  <line x1="10" y1="300" x2="790" y2="300" stroke="#1b4d38" stroke-width="1"/>
  <text x="25" y="318" class="status-bar">🌿 main</text>
  <text x="100" y="318" class="status-bar">Ln 10, Col 2</text>
  <text x="700" y="318" class="status-bar">⚡ Live</text>
  <text x="745" y="318" class="status-bar">JS</text>

  <g clip-path="url(#window-clip)">
    <clipPath id="window-clip">
      <rect x="10" y="10" width="780" height="320" rx="8"/>
    </clipPath>
    <rect x="-780" y="10" width="780" height="320" class="shining-overlay"/>
  </g>
</svg>
